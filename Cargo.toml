[package]
name = "picos"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A small, observable machine for experiments in agent-built operating systems"
publish = false
default-run = "picos"

[lib]
name = "smol_os"

[[bin]]
name = "picos"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
flate2 = "1"
libc = "0.2"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
jsonwebtoken = { version = "9", default-features = false }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "time", "net"] }

[profile.release]
lto = "thin"
codegen-units = 1

